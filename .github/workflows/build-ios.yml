# Dựng tệp .ipa CHƯA KÍ cho iOS (máy macOS của GitHub). Chạy tay: Actions → iOS IPA → Run workflow.
# iPhone chỉ cài được sau khi kí: dùng Sideloadly/AltStore với Apple ID (hết hạn sau 7 ngày),
# hoặc tài khoản Apple Developer (99 USD/năm) để kí, đưa lên TestFlight/App Store.
name: iOS IPA (chưa kí)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: ls -d /Applications/Xcode*.app; X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "::notice::Dùng $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          build() {
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -archivePath build/app.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "$@" > build.log 2>&1
          }
          report() { grep -E "error:|fatal" build.log | sort -u | head -25 | while IFS= read -r l; do echo "::error::$l"; done; }
          # Expo SDK 58 cần Xcode 27 (Swift 6.4). Nếu gặp lỗi đồng thời Swift thì thử lại ở chế độ Swift 5
          build || { report; grep -q "risks causing data races\|concurrency" build.log && { echo "::warning::Thử lại với SWIFT_VERSION=5"; build SWIFT_VERSION=5 SWIFT_STRICT_CONCURRENCY=minimal || { report; exit 1; }; } || exit 1; }
          mkdir -p Payload && cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qr ../codeplus-thi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: codeplus-thi-ios, path: codeplus-thi-unsigned.ipa }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iOS bản ${{ github.run_number }} (chưa kí)
          body: Tệp .ipa chưa kí — cài bằng Sideloadly/AltStore với Apple ID, hoặc kí bằng tài khoản Apple Developer.
          files: codeplus-thi-unsigned.ipa
